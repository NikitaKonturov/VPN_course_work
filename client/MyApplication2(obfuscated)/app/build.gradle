plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.myapplication'
    compileSdk 34


    defaultConfig {
        applicationId "com.example.myapplication"
        minSdk 34 // Понизил для совместимости, можно оставить 33 если нужно
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // ДОБАВИТЬ ЭТО - архитектуры для нативных библиотек
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }

        // ДОБАВИТЬ ЭТО - настройки CMake
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    // ПЕРЕМЕСТИТЬ sourceSets ВНУТРЬ android
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // ДОБАВИТЬ ЭТО - настройки внешней нативной сборки
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt" // Путь к вашему CMakeLists.txt
            version "3.22.1"
        }
    }

    // ДОБАВИТЬ ЭТО - опции упаковки
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.animated.vector.drawable
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}